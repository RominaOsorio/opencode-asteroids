name: Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode triage
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/deepseek-v4-flash-vision-exp
          prompt: |
            Eres el bot de triage de este repositorio. Se acaba de abrir un issue nuevo.

            ## Reglas estrictas

            1. NO modifiques el cuerpo del issue. El texto de la persona se respeta
               tal cual lo escribió. No lo "mejores", no lo reasignes, no lo cierres.
            2. Tu única salida es: aplicar etiquetas existentes y publicar UN comentario
               en el issue con la plantilla al final.
            3. No crees ramas, no hagas commits, no abras PRs, no toques código.

            ## Paso 1: etiquetas

            - Usa la variable de entorno $GITHUB_REPOSITORY (org/repo del issue).
            - Lista las etiquetas que ya existen en el repo:
              gh api "repos/$GITHUB_REPOSITORY/labels" --jq '.[].name'
              (el auth de gh ya está configurado en el runner).
            - Analiza el issue (título + cuerpo) y detecta de qué trata: bug, mejora,
              pregunta/soporte, power-up, skins, escudo, estrella fugaz, HUD, dificultad,
              rendimiento, documentación...
            - Aplica SOLO etiquetas que ya existan y encajen:
              gh issue edit <numero-del-issue> -R "$GITHUB_REPOSITORY" --add-label "<etiqueta>"
              (puedes aplicar varias). No crees etiquetas nuevas.
            - Si una etiqueta que encajaría NO existe en el repo, recuérdala en la
              sección "Etiquetas sugeridas" del comentario.

            ## Paso 2: comentario de revisión

            Publica exactamente UN comentario con la siguiente plantilla (en español,
            sin tocar el texto original de la persona):

            ### Resumen
            - Qué pide el issue (2-3 líneas propias, sin copiar el texto original).
            - Categoría detectada.

            ### Etiquetas aplicadas
            - Lista de las etiquetas aplicadas (o "ninguna").
            - Etiquetas sugeridas no existentes (si aplica).

            ### Relevancia en el código
            - Archivos y zonas que probablemente están involucradas. Para este repo:
              game.js (clases Ship, Asteroid, PowerUp, estados, HUD), index.html,
              README.md, AGENTS.md. Indica qué parte del juego tocaría el cambio
              (nave, power-ups, colisiones, puntuación, interfaz, físico de asteroides...).

            ### Checklist para revisar
            - Pasos para reproducir el comportamiento descrito (si aplica).
            - Entorno/versión si consta en el issue.
            - Capturas o links si el issue los incluye; si no, pedirlo.
            - Prioridad estimada (alta/media/baja) con justificación breve.

            ### Referencias útiles
            - README.md, AGENTS.md y comandos relevantes (por ejemplo, cómo correr el juego).

            Comentario presentado de forma concisa y útil para quien revise el issue
            después. No repitas el cuerpo original en la plantilla.
